[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqube-agent-guard"
version = "1.0.3"
description = "Open-source execution authorization and control infrastructure for AI agents"
readme = "README.pypi.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sqube Groups" }]
keywords = ["ai", "agents", "execution", "guardrail", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
control-plane = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
probes = ["requests>=2.31", "python-dotenv>=1.0"]
policy = ["PyYAML>=6.0"]

[project.scripts]
sqube-agent-guard = "sqube_agent_guard.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["sqube_agent_guard"]

[tool.hatch.build.targets.sdist]
exclude = ["/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
