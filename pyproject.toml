[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqube-agent-guard"
version = "0.1.0"
description = "Developer-side execution guardrail with decision, optional human pause, and append-only ledger (v0.1 experiment)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sqube Groups" }]
keywords = ["ai", "agents", "execution", "guardrail", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
probes = ["requests>=2.31", "python-dotenv>=1.0"]

[project.scripts]
sqube-agent-guard = "sqube_agent_guard.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["sqube_agent_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
