name: Release

# Publishes to PyPI and npm only when a semver tag (v*.*.*) is pushed and the
# tagged commit is on main. Tag from main after merge; tags on other branches
# are rejected by the assert-on-main job.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  assert-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  python:
    needs: assert-on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true

  node:
    needs: assert-on-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # crates.io publish disabled until a registry account/token is available.
