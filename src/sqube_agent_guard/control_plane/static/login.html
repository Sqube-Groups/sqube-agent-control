<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in — Sqube Control Plane</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <script>
    (function () {
      var stored = localStorage.getItem("sqube_theme");
      var theme = stored === "light" || stored === "dark" ? stored : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Sqube Control Plane</h1>
    <p class="tagline">Sign in to manage fleet visibility and approvals.</p>
    <form id="login-form">
      <label>Username <input name="username" autocomplete="username" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <div id="sso-section" class="sso-section hidden">
      <p class="divider">or continue with SSO</p>
      <div id="sso-buttons"></div>
    </div>
    <p id="login-error" class="error hidden"></p>
  </div>
  <script src="/assets/login.js"></script>
</body>
</html>
