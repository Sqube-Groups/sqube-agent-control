[package]
name = "sqube-guard"
version = "0.1.0"
edition = "2021"
description = "Developer-side execution guardrail (v0.1 experiment)"
license = "Apache-2.0"
repository = "https://github.com/Sqube-Groups/sqube-agent-control"
readme = "README.md"
keywords = ["ai", "agents", "execution", "guardrail"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
